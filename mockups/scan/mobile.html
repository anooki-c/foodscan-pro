<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>食品配料分析 · 条形码扫描</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <style>
    @font-face {
      font-family: "Material Symbols Rounded";
      font-style: normal;
      font-weight: 100 700;
      font-display: swap;
      src: url("../assets/fonts/material-symbols-rounded.woff2") format("woff2");
    }
    .material-symbols-rounded {
      font-family: "Material Symbols Rounded";
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
  </style>
  <link rel="stylesheet" href="../../tokens/design-tokens.css" />
  <style>
    html, body {
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #EDE7F6 0%, #FCE4EC 60%, #F8D7E8 100%);
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--color-text-primary);
    }
    .device-frame {
      width: 390px;
      min-height: 844px;
      margin: 24px auto;
      border-radius: 36px;
      box-shadow: 0 20px 60px rgba(124, 91, 201, 0.18);
      overflow: hidden;
      position: relative;
      border: 8px solid #1A1626;
      background: #0E0A1A; /* 深色取景背景 */
    }
    .device-status {
      height: 54px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 32px;
      font: 600 15px/1 var(--font-display);
      color: #fff;
      position: relative;
      background: #0E0A1A;
    }
    .device-status .icons { display: flex; gap: 6px; align-items: center; }
    .device-status .material-symbols-rounded { font-size: 16px; }
    .dynamic-island {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 32px;
      background: #000;
      border-radius: 16px;
    }

    /* 顶部返回栏 */
    .scanner-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 16px 16px;
      background: #0E0A1A;
    }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn .material-symbols-rounded { font-size: 22px; }

    /* 取景区 */
    .scanner-stage {
      position: relative;
      height: 380px;
      background:
        radial-gradient(ellipse at center, rgba(124,91,201,0.25) 0%, transparent 70%),
        linear-gradient(160deg, rgba(124,91,201,0.35), rgba(236,72,153,0.25));
      overflow: hidden;
    }
    .scanner-stage::before {
      content: '';
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .scan-guide {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 260px; height: 130px;
    }
    .scan-guide .corner {
      position: absolute;
      width: 32px; height: 32px;
      border: 3px solid #fff;
      border-radius: 6px;
    }
    .scan-guide .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
    .scan-guide .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
    .scan-guide .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
    .scan-guide .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }
    .scan-line {
      position: absolute;
      left: 8px; right: 8px; top: 50%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #EC4899, transparent);
      border-radius: 2px;
      animation: scan 2.2s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(236,72,153,0.8);
    }
    @keyframes scan {
      0%, 100% { top: 12%; opacity: 0.6; }
      50% { top: 86%; opacity: 1; }
    }
    .scan-hint {
      position: absolute;
      left: 0; right: 0; bottom: 24px;
      text-align: center;
      color: rgba(255,255,255,0.85);
      font: 500 14px/20px var(--font-body);
    }

    /* 底部控制 */
    .scanner-bottom {
      padding: 24px 20px 120px;
      background: #0E0A1A;
      color: #fff;
    }
    .scanner-bottom .hint-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-card);
      padding: 16px;
      margin-bottom: 16px;
      font: 400 13px/20px var(--font-body);
      color: rgba(255,255,255,0.85);
    }
    .btn-row { display: flex; gap: 12px; }
    .btn {
      flex: 1;
      height: 48px;
      border-radius: var(--radius-pill);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font: 600 14px/20px var(--font-body);
      cursor: pointer;
      border: none;
    }
    .btn.secondary {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
    }
    .btn.flash {
      width: 48px; flex: none;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
    }

    /* 手动输入弹层 */
    .manual-sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
      transform: translateY(100%);
      transition: transform 0.3s var(--ease-emphasized);
      z-index: var(--z-modal);
    }
    .manual-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px;
      background: rgba(124,91,201,0.3);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .manual-sheet h3 { font: 700 20px/28px var(--font-display); margin: 0 0 4px; }
    .manual-sheet p { font: 400 13px/20px var(--font-body); color: var(--color-text-secondary); margin: 0 0 16px; }
    .manual-input {
      width: 100%;
      box-sizing: border-box;
      height: 52px;
      border-radius: var(--radius-default);
      border: 1px solid var(--color-divider);
      background: var(--color-surface-container-lowest);
      padding: 0 16px;
      font: 500 16px/1 var(--font-mono);
      letter-spacing: var(--tracking-wide);
      color: var(--color-text-primary);
    }
    .manual-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 4px var(--color-primary-fixed); }
    .sheet-actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn.primary {
      background: var(--gradient-accent);
      color: white;
      box-shadow: var(--shadow-floating);
    }
    .btn.ghost {
      background: transparent;
      border: 1px solid var(--color-divider);
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="device-status">
      <span>9:41</span>
      <div class="dynamic-island"></div>
      <span class="icons">
        <span class="material-symbols-rounded">signal_cellular_alt</span>
        <span class="material-symbols-rounded">wifi</span>
        <span class="material-symbols-rounded">battery_full</span>
      </span>
    </div>

    <div class="scanner-top">
      <button class="icon-btn" aria-label="返回">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <div style="font: 700 16px/24px var(--font-display); color:#fff">扫描条形码</div>
      <button class="icon-btn" aria-label="手动输入" onclick="openSheet()">
        <span class="material-symbols-rounded">keyboard</span>
      </button>
    </div>

    <div class="scanner-stage">
      <div class="scan-guide">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="scan-line"></div>
      </div>
      <div class="scan-hint">将条形码对准取景框</div>
    </div>

    <div class="scanner-bottom">
      <div class="hint-box">
        扫描成功后将查询食品数据库。未找到时，可拍摄配料表或手动输入。
      </div>
      <div class="btn-row">
        <button class="btn secondary" onclick="openSheet()">
          <span class="material-symbols-rounded" style="font-size:18px">edit_note</span>
          手动输入
        </button>
        <button class="btn flash" aria-label="闪光灯">
          <span class="material-symbols-rounded" style="font-size:20px">flash_on</span>
        </button>
      </div>
    </div>

    <!-- 手动输入 BottomSheet -->
    <div class="manual-sheet" id="manualSheet">
      <div class="sheet-handle"></div>
      <h3>手动输入条形码</h3>
      <p>输入商品包装上的条码数字，从数据库查询配料表。</p>
      <input class="manual-input" type="text" inputmode="numeric" placeholder="例如 6901234567890" />
      <div class="sheet-actions">
        <button class="btn ghost" style="flex:1" onclick="closeSheet()">取消</button>
        <button class="btn primary" style="flex:1">查询</button>
      </div>
    </div>
  </div>

  <script>
    function openSheet() { document.getElementById('manualSheet').classList.add('open'); }
    function closeSheet() { document.getElementById('manualSheet').classList.remove('open'); }
  </script>
</body>
</html>
