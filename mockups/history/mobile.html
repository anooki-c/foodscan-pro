<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>食品配料分析 · 历史记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <style>
    @font-face {
      font-family: "Material Symbols Rounded";
      font-style: normal;
      font-weight: 100 700;
      font-display: swap;
      src: url("../assets/fonts/material-symbols-rounded.woff2") format("woff2");
    }
    .material-symbols-rounded {
      font-family: "Material Symbols Rounded";
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
  </style>
  <link rel="stylesheet" href="../../tokens/design-tokens.css" />
  <style>
    html, body {
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #EDE7F6 0%, #FCE4EC 60%, #F8D7E8 100%);
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--color-text-primary);
    }
    .device-frame {
      width: 390px;
      min-height: 844px;
      margin: 24px auto;
      border-radius: 36px;
      box-shadow: 0 20px 60px rgba(124, 91, 201, 0.18);
      overflow: hidden;
      position: relative;
      border: 8px solid #1A1626;
      background: var(--gradient-bg);
    }
    .device-status {
      height: 54px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 32px;
      font: 600 15px/1 var(--font-display);
      color: var(--color-text-primary);
      position: relative;
    }
    .device-status .icons { display: flex; gap: 6px; align-items: center; }
    .device-status .material-symbols-rounded { font-size: 16px; }
    .dynamic-island {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 32px;
      background: #0E0A1A;
      border-radius: 16px;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 16px 12px;
    }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.32);
      backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.45);
      color: var(--color-text-primary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .topbar .title { font: 700 16px/24px var(--font-display); }

    .scroll { padding: 0 0 130px; }

    /* 搜索 */
    .search-box {
      margin: 8px 20px 16px;
      display: flex; align-items: center; gap: 10px;
      height: 48px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.32);
      backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
      color: var(--color-text-tertiary);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font: 500 14px/20px var(--font-body);
      color: var(--color-text-primary);
    }
    .search-box input::placeholder { color: var(--color-text-tertiary); }

    /* 筛选 chips */
    .filter-row {
      display: flex; gap: 8px; padding: 0 20px 16px;
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.32);
      backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.45);
      font: 500 12px/16px var(--font-body);
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    .filter-chip.active {
      background: var(--gradient-accent);
      color: white;
      border-color: transparent;
      font-weight: 600;
    }

    /* 历史卡片 */
    .history-list { margin: 0 20px; display: flex; flex-direction: column; gap: 12px; }
    .history-card {
      background: rgba(255,255,255,0.30);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.50);
      border-radius: var(--radius-card);
      padding: 12px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.55);
      cursor: pointer;
    }
    .history-thumb {
      width: 56px; height: 56px;
      border-radius: var(--radius-thumb);
      display: flex; align-items: center; justify-content: center;
      color: white;
      flex-shrink: 0;
    }
    .history-thumb .material-symbols-rounded { font-size: 26px; }
    .history-meta { flex: 1; min-width: 0; }
    .history-name { font: 600 14px/20px var(--font-display); margin-bottom: 4px; }
    .history-stats { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .history-time { font: 400 11px/16px var(--font-mono); color: var(--color-text-tertiary); flex-basis: 100%; margin-bottom: 2px; }
    .history-chip {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font: 500 10px/14px var(--font-mono);
      letter-spacing: var(--tracking-wide);
    }
    .history-chip.natural { background: var(--color-status-natural-bg); color: var(--color-status-natural-fg); }
    .history-chip.processed { background: var(--color-status-processed-bg); color: var(--color-status-processed-fg); }
    .history-chip.additive { background: var(--color-status-additive-bg); color: var(--color-status-additive-fg); }
    .history-chip.allergen { background: var(--color-status-allergen-bg); color: var(--color-status-allergen-fg); }
    .history-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .mini-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      font: 500 11px/14px var(--font-mono);
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      border: 1px solid var(--color-divider);
      background: rgba(255,255,255,0.5);
      color: var(--color-text-secondary);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .mini-btn.primary {
      background: var(--gradient-accent);
      color: white;
      border: none;
      font-weight: 600;
    }
    .mini-btn.danger { color: var(--color-error); border-color: var(--color-status-additive-border); }

    /* 底部 Tab（玻璃药丸） */
    .tabbar-wrap {
      position: absolute; left: 0; right: 0; bottom: 16px;
      display: flex; justify-content: center;
      padding: 0 16px;
    }
    .tabbar {
      display: flex; gap: 4px; padding: 6px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-pill);
      box-shadow: 0 8px 32px rgba(124, 91, 201, 0.16);
      width: 100%; max-width: 340px;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .tab {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 10px 0;
      border-radius: var(--radius-pill);
      color: var(--color-text-secondary);
      cursor: pointer;
      border: none; background: transparent;
      transition: all var(--duration-short) var(--ease-standard);
    }
    .tab.active { background: var(--gradient-cool); color: white; box-shadow: 0 4px 12px rgba(92,107,192,0.3); }
    .tab .material-symbols-rounded { font-size: 22px; }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="device-status">
      <span>9:41</span>
      <div class="dynamic-island"></div>
      <span class="icons">
        <span class="material-symbols-rounded">signal_cellular_alt</span>
        <span class="material-symbols-rounded">wifi</span>
        <span class="material-symbols-rounded">battery_full</span>
      </span>
    </div>

    <div class="topbar">
      <button class="icon-btn" aria-label="返回">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <div class="title">历史记录</div>
      <div style="width:40px"></div>
    </div>

    <div class="scroll">
      <div class="search-box">
        <span class="material-symbols-rounded" style="font-size:20px">search</span>
        <input type="text" placeholder="搜索食品名称…" />
        <span class="material-symbols-rounded" style="font-size:18px">tune</span>
      </div>

      <div class="filter-row">
        <button class="filter-chip active">全部</button>
        <button class="filter-chip">含添加剂</button>
        <button class="filter-chip">含过敏原</button>
        <button class="filter-chip">本周</button>
        <button class="filter-chip">更早</button>
      </div>

      <div class="history-list">
        <article class="history-card">
          <div class="history-thumb" style="background: linear-gradient(135deg, #A5D6A7 0%, #66BB6A 100%);">
            <span class="material-symbols-rounded">inventory_2</span>
          </div>
          <div class="history-meta">
            <div class="history-name">即食燕麦片</div>
            <div class="history-stats">
              <span class="history-time">12 项 · 2 分钟前</span>
              <span class="history-chip natural">天然 6</span>
              <span class="history-chip additive">添加剂 3</span>
              <span class="history-chip allergen">过敏原 2</span>
            </div>
          </div>
          <div class="history-actions">
            <button class="mini-btn primary">详情</button>
            <button class="mini-btn">+ 对比</button>
          </div>
        </article>

        <article class="history-card">
          <div class="history-thumb" style="background: linear-gradient(135deg, #F48FB1 0%, #EC407A 100%);">
            <span class="material-symbols-rounded">local_drink</span>
          </div>
          <div class="history-meta">
            <div class="history-name">能量饮料</div>
            <div class="history-stats">
              <span class="history-time">24 项 · 1 小时前</span>
              <span class="history-chip natural">天然 10</span>
              <span class="history-chip processed">加工 4</span>
              <span class="history-chip additive">添加剂 10</span>
            </div>
          </div>
          <div class="history-actions">
            <button class="mini-btn primary">详情</button>
            <button class="mini-btn">+ 对比</button>
          </div>
        </article>

        <article class="history-card">
          <div class="history-thumb" style="background: linear-gradient(135deg, #FFCC80 0%, #FFA726 100%);">
            <span class="material-symbols-rounded">cookie</span>
          </div>
          <div class="history-meta">
            <div class="history-name">巧克力饼干</div>
            <div class="history-stats">
              <span class="history-time">18 项 · 昨天 21:14</span>
              <span class="history-chip natural">天然 8</span>
              <span class="history-chip processed">加工 5</span>
              <span class="history-chip additive">添加剂 5</span>
              <span class="history-chip allergen">过敏原 3</span>
            </div>
          </div>
          <div class="history-actions">
            <button class="mini-btn primary">详情</button>
            <button class="mini-btn">+ 对比</button>
          </div>
        </article>

        <article class="history-card">
          <div class="history-thumb" style="background: linear-gradient(135deg, #B39DDB 0%, #7E57C2 100%);">
            <span class="material-symbols-rounded">rice_bowl</span>
          </div>
          <div class="history-meta">
            <div class="history-name">原味希腊酸奶</div>
            <div class="history-stats">
              <span class="history-time">4 项 · 2 天前</span>
              <span class="history-chip natural">天然 4</span>
              <span class="history-chip allergen">过敏原 1</span>
            </div>
          </div>
          <div class="history-actions">
            <button class="mini-btn primary">详情</button>
            <button class="mini-btn danger">删除</button>
          </div>
        </article>
      </div>
    </div>

    <div class="tabbar-wrap">
      <nav class="tabbar">
        <button class="tab"><span class="material-symbols-rounded">home</span></button>
        <button class="tab active"><span class="material-symbols-rounded">history</span></button>
        <button class="tab"><span class="material-symbols-rounded">compare_arrows</span></button>
        <button class="tab"><span class="material-symbols-rounded">person</span></button>
      </nav>
    </div>
  </div>
</body>
</html>
