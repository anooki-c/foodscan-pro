# ============================================================
# 食品配料分析 · Docker 镜像构建（GitHub Actions）
#
# 触发：
#   - push 到 main / master
#   - push 版本 tag（v1.0.0 等）
#   - 手动触发
#
# 产物：
#   - ghcr.io/<owner>/foodscan-pro:latest
#   - ghcr.io/<owner>/foodscan-pro:<version>（打 tag 时）
#   - ghcr.io/<owner>/foodscan-pro:<arch>-sha-<commit>
#
# 平台：linux/amd64 + linux/arm64（两个独立 job 并行，避免 QEMU 串行模拟）
# ============================================================

name: Build Docker Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/foodscan-pro

jobs:
  build:
    name: Build (${{ matrix.platform.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: linux-amd64
            target: linux/amd64
            arch: amd64
          - label: linux-arm64
            target: linux/arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.platform.arch }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.platform.arch }}-sha-${{ github.sha }}
            type=ref,event=tag
            type=ref,event=branch
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/
          file: app/Dockerfile
          push: true
          platforms: ${{ matrix.platform.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 国内/慢网下构建时取消注释：
          # build-args: NPM_REGISTRY=https://registry.npmmirror.com