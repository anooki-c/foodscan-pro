# ============================================================
# 食品配料分析 · Docker 镜像构建（GitHub Actions）
#
# 触发：
#   - push 到 main / master
#   - push 版本 tag（v1.0.0 等）
#   - 手动触发（Actions 页面 Run workflow）
#
# 产物：
#   - ghcr.io/<owner>/foodscan-pro:latest
#   - ghcr.io/<owner>/foodscan-pro:<version>（打 tag 时）
#   - ghcr.io/<owner>/foodscan-pro:sha-<commit>
#
# 平台：linux/amd64 + linux/arm64（覆盖群晖 Intel/ARM 机型）
# 构建上下文：app/（含 Dockerfile）
# ============================================================

name: Build Docker Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  # GHCR 镜像名（不含 tag）
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/foodscan-pro

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 多架构支持（amd64 / arm64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR（GITHUB_TOKEN 自动注入，无需配置）
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成标签 + 构建元数据
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          flavor: |
            latest=auto

      # 构建并推送（多架构）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/
          file: app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 国内构建慢时可用：
          # build-args: |
          #   NPM_REGISTRY=https://registry.npmmirror.com
