# ============================================================
# 食品配料分析 · 群晖部署（docker-compose）
# 用法（群晖 SSH）：
#   cd /volume1/docker/foodscan/app
#   docker compose up -d --build
# 或在群晖 Container Manager → 项目 → 新建 → 导入本文件
#
# ⚠️ OCR / AI 配置请到后台管理页（/admin/ocr、/admin/ai）配置，
#    持久化在 data/config.json（挂载卷），修改后立即生效。
#    下方 OCR_* / AI_* 环境变量仅作为首次启动默认值。
# ============================================================

services:
  foodscan:
    build:
      context: .
      dockerfile: Dockerfile
      # 国内构建慢时取消注释：
      # args:
      #   NPM_REGISTRY: https://registry.npmmirror.com
    image: foodscan-pro:latest
    container_name: foodscan-pro
    restart: unless-stopped
    ports:
      # 宿主机端口 : 容器端口（改左边的 3001 可换对外端口）
      - "3001:3000"
    environment:
      # ---- 食品数据库（OFF） ----
      OFF_ENABLED: "true"
      # OFF_API_URL: "https://world.openfoodfacts.org"

      # ---- 第三方 OCR（可选默认值，后台可改） ----
      OCR_ENABLED: "false"
      # OCR_PROVIDER: "provider-a"
      # OCR_API_URL: "https://your-ocr-provider.example.com/v1/recognize"
      # OCR_API_KEY: "xxx"
      OCR_TIMEOUT_MS: "10000"
      OCR_CONFIDENCE_THRESHOLD: "80"

      # ---- AI 配料解读（可选默认值，后台可改） ----
      AI_ENABLED: "false"
      # AI_PROVIDER: "openai-compatible"
      # AI_API_URL: "https://api.example.com/v1/chat/completions"
      # AI_API_KEY: "xxx"
      AI_TIMEOUT_MS: "15000"
    volumes:
      # 运行时配置持久化：后台修改的 OCR/AI 配置（data/config.json）
      - foodscan_data:/app/data
    networks:
      - foodscan-net

networks:
  foodscan-net:
    driver: bridge

volumes:
  foodscan_data:
